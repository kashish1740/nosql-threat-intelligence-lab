services:
  mongo:
    image: mongo:7.0
    # MongoDB Compass: mongodb://localhost:27039
    ports: ["127.0.0.1:27039:27017"]
  cassandra:
    image: cassandra:4.1
    # Ch 16 audit log and Ch 18 FP review are read by the dashboard through this port.
    ports: ["127.0.0.1:9042:9042"]
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
  neo4j:
    image: neo4j:5.26-community
    # Neo4j Browser: http://localhost:7474 (no password); Bolt for the dashboard on 7687.
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    environment:
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
  lab:
    build:
      context: ..
      dockerfile: Dockerfile.labs
    environment:
      MONGO_URI: mongodb://mongo:27017
      CASSANDRA_HOST: cassandra
      NEO4J_URI: bolt://neo4j:7687
      THREAT_FEEDS: ${THREAT_FEEDS:-}
    volumes: ["../results:/work/results", "../data:/work/data"]
    depends_on: [mongo, cassandra, neo4j]
